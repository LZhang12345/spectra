<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="330" viewBox="0 0 1440 330" role="img" aria-labelledby="mtitle mdesc">
  <title id="mtitle">How SPECTRA works</title>
  <desc id="mdesc">Three steps. Fine-tune the LLM on interaction data, ask one yes/no question per category and read the logit difference, then apply a softmax to obtain a distribution over categories.</desc>
  <rect width="1440" height="330" rx="24" fill="#f4f7fb"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="40" y="40" width="400" height="250" rx="20" fill="#ffffff" stroke="#d6deea" stroke-width="1.5"/>
    <rect x="40" y="40" width="400" height="8" rx="4" fill="#7253c8"/>
    <circle cx="92" cy="98" r="22" fill="#7253c8"/>
    <text x="92" y="105" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
    <text x="128" y="106" font-size="23" font-weight="800" fill="#20364e">Align the LLM</text>
    <text x="74" y="176" font-size="17" fill="#44546a">Continue pretraining on domain text,</text>
    <text x="74" y="203" font-size="17" fill="#44546a">then fine-tune with LoRA to predict</text>
    <text x="74" y="230" font-size="17" fill="#44546a">the user's category distribution</text>
    <text x="74" y="257" font-size="17" fill="#44546a">from interaction history.</text>
  </g>
  <path d="M454 165 H506" stroke="#8fa3bd" stroke-width="3" stroke-linecap="round"/>
  <path d="M496 155 L508 165 L496 175" fill="none" stroke="#8fa3bd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="520" y="40" width="400" height="250" rx="20" fill="#ffffff" stroke="#d6deea" stroke-width="1.5"/>
    <rect x="520" y="40" width="400" height="8" rx="4" fill="#f0a53a"/>
    <circle cx="572" cy="98" r="22" fill="#f0a53a"/>
    <text x="572" y="105" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
    <text x="608" y="106" font-size="23" font-weight="800" fill="#20364e">Probe every category</text>
    <text x="554" y="176" font-size="17" fill="#44546a">Ask one yes/no question per category</text>
    <text x="554" y="203" font-size="17" fill="#44546a">and read the next-token logits.</text>
    <text x="554" y="230" font-size="17" fill="#44546a"></text>
    <text x="554" y="257" font-size="17" fill="#44546a">S = mean logit(Yes) − mean logit(No)</text>
  </g>
  <path d="M934 165 H986" stroke="#8fa3bd" stroke-width="3" stroke-linecap="round"/>
  <path d="M976 155 L988 165 L976 175" fill="none" stroke="#8fa3bd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="1000" y="40" width="400" height="250" rx="20" fill="#ffffff" stroke="#d6deea" stroke-width="1.5"/>
    <rect x="1000" y="40" width="400" height="8" rx="4" fill="#149d81"/>
    <circle cx="1052" cy="98" r="22" fill="#149d81"/>
    <text x="1052" y="105" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
    <text x="1088" y="106" font-size="23" font-weight="800" fill="#20364e">Normalize</text>
    <text x="1034" y="176" font-size="17" fill="#44546a">Apply a softmax over the K scores.</text>
    <text x="1034" y="203" font-size="17" fill="#44546a"></text>
    <text x="1034" y="230" font-size="17" fill="#44546a">θ = softmax(S / τ)</text>
    <text x="1034" y="257" font-size="17" fill="#44546a">A probability for every category.</text>
  </g>
</svg>
