[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra-probe"
version = "0.1.0"
description = "SPECTRA: category-level preference distributions read from an LLM's token logits"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luyang Zhang" }, { name = "Jialu Wang" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
models = ["torch>=2.1", "transformers>=4.44", "peft>=0.11"]
plots = ["matplotlib>=3.8", "pillow>=10"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "scripts", "examples"]
